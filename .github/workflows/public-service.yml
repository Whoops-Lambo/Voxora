name: Public Voxora service
on:
  push:
    branches: [main, 'fix/**', 'feature/**']
    paths:
      - '*.js'
      - 'desktop/platform.json'
      - 'public/**'
      - 'package*.json'
      - 'Dockerfile'
      - 'public-server.js'
      - 'render.yaml'
      - 'build/check-public-service.mjs'
      - 'build/deploy-public.mjs'
      - 'build/deployment-readiness.mjs'
      - '.github/workflows/public-service.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-voxora-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Validate native image conversion in the production container
        run: |
          docker build -t voxora-release-check .
          docker run --rm --entrypoint node voxora-release-check --input-type=module -e "import sharp from 'sharp'; import {richImage} from './rich-images.js'; const png=await sharp({create:{width:2,height:2,channels:4,background:'#55e6bc'}}).png().toBuffer(); const result=await richImage(png,{width:64,height:64},(_status,message)=>{throw Error(message)}); if(result.mime!=='image/webp'||!result.bytes.length)throw Error('Native image conversion failed'); console.log('Production container native image conversion passed');"
      - run: npx playwright install --with-deps chromium
      - name: Exercise community and admin controls, including real WebRTC media
        run: npx playwright test test/ui/community-admin.spec.mjs test/ui/community-v4.spec.mjs test/ui/premium.spec.mjs test/ui/boost-invites.spec.mjs test/ui/forums.spec.mjs test/ui/conversations.spec.mjs test/ui/server-management.spec.mjs test/ui/management.spec.mjs test/ui/bot-templates.spec.mjs test/ui/mobile-update.spec.mjs test/ui/app.spec.mjs test/ui/sounds.spec.mjs test/ui/privacy-policy.spec.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: community-browser-failure
          path: test-results/
          retention-days: 5
  health:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy the tested main commit through the private Render hook
        if: github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: node build/deploy-public.mjs
      - name: Verify public version, features, interface and account privacy
        run: node build/check-public-service.mjs ${{ github.ref == 'refs/heads/main' && '--require-sync --require-features --require-version --require-commit --require-assets' || '' }}
      - name: Record the public deployment proof
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="deployment-verified/v${version}-${GITHUB_SHA}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            test "$(git rev-parse "refs/tags/${tag}")" = "$GITHUB_SHA"
          else
            git tag "$tag" "$GITHUB_SHA"
          fi
          git push origin "refs/tags/${tag}"
