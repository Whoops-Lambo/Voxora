name: Exact Windows installer
on:
  push:
    branches: ['release-candidates/**']
    paths: ['installers/*.exe', 'installers/SHA256SUMS.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  published:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Download and verify the candidate installer
        id: artifact
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = "Voxora-Setup-$version.exe"
          git lfs pull --include="installers/$name" --exclude=
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = (Get-Content installers/SHA256SUMS.txt | Where-Object { $_.EndsWith('  ' + $name) }).Split(' ')[0]
          $digest = (Get-FileHash -LiteralPath "installers/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $expected -or $digest -notmatch '^[a-f0-9]{64}$') { throw 'Candidate installer SHA-256 mismatch.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "digest=$digest" >> $env:GITHUB_OUTPUT
      - name: Fetch the previous release for an actual old-client upgrade
        run: git lfs pull --include=installers/Voxora-Setup-3.3.2.exe --exclude=
      - name: Execute this exact installer and desktop on Windows
        shell: pwsh
        run: |
          $version = '${{ steps.artifact.outputs.version }}'
          try {
            ./build/test-windows-install.ps1 -InstallerPath "installers/Voxora-Setup-$version.exe" -ExpectedVersion $version -PreviousInstallerPath "installers/Voxora-Setup-3.3.2.exe" 2>&1 | Tee-Object -FilePath published-smoke.log
          } catch {
            $_ | Tee-Object -FilePath published-smoke.log -Append
            $detail = ((Get-Content published-smoke.log -Tail 60) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Exact published installer failure::$detail"
            exit 1
          }
      - name: Record the exact tested commit and installer hash
        shell: pwsh
        run: |
          $tag = 'installer-verified/v${{ steps.artifact.outputs.version }}-${{ steps.artifact.outputs.digest }}'
          $existing = git rev-parse --verify "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -ne $env:GITHUB_SHA) { throw 'Verification tag points to another commit.' }
          } else {
            git tag $tag $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
