name: Windows installer
on:
  push:
    branches: [main, 'fix/**', 'feature/**']
    paths:
      - 'build/**'
      - 'desktop/**'
      - 'package*.json'
      - 'test/installer.mjs'
      - 'test/connection.mjs'
      - 'test/members.mjs'
      - 'test/forums.mjs'
      - 'test/nicknames.mjs'
      - 'test/update-delivery.mjs'
      - 'test/updater.mjs'
      - 'test/native-handoff.mjs'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Exercise the compiled installer file operations
        shell: pwsh
        run: |
          node -e "require('app-builder-lib/out/toolsets/windows.js').getMakeNsisPath().then(p => require('fs').writeFileSync('nsis-toolset.json', JSON.stringify(p)))"
          $toolset = Get-Content nsis-toolset.json -Raw | ConvertFrom-Json
          $env:VOXORA_NSIS_PATH = $toolset.path
          $ErrorActionPreference = 'Continue'
          node --test --test-reporter=spec test/native-handoff.mjs test/updater.mjs test/installer.mjs test/connection.mjs test/members.mjs test/forums.mjs test/nicknames.mjs test/update-delivery.mjs 2>&1 | Tee-Object -FilePath installer-tests.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $detail = ((Get-Content installer-tests.log -Tail 45) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Compiled installer regression::$detail"
            exit $result
          }
      - name: Build the production installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npm run dist:win 2>&1 | Tee-Object -FilePath installer-build.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $detail = ((Get-Content installer-build.log -Tail 45) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Production installer build::$detail"
            exit $result
          }
      - name: Fetch the published 3.2.1 installer for an actual upgrade
        run: git lfs pull --include=installers/Voxora-Setup-3.2.1.exe --exclude=
      - name: Install, start, reinstall and uninstall the production app
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $result = 0
          try {
            ./build/test-windows-install.ps1 -InstallerPath "dist/Voxora-Setup-$version.exe" -ExpectedVersion $version -PreviousInstallerPath "installers/Voxora-Setup-3.2.1.exe" 2>&1 | Tee-Object -FilePath production-smoke.log
          } catch {
            $_ | Tee-Object -FilePath production-smoke.log -Append
            $result = 1
          }
          if ($result -ne 0) {
            $detail = ((Get-Content production-smoke.log -Tail 55) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Production update smoke test::$detail"
            exit $result
          }
