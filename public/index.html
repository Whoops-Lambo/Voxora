<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#313338" />
    <title>Voxora</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/bots.css" />
  </head>
  <body>
    <div id="loading" class="loading">
      <div class="voxora-mark">V</div>
      <span>Connecting to Voxora…</span>
    </div>
    <section id="auth" hidden>
      <div class="auth-brand"><span class="voxora-mark">V</span> VOXORA</div>
      <div class="auth-background">
        <span>#</span><span>✦</span><span>♡</span>
      </div>
      <form id="auth-form" class="auth-card">
        <h1 id="auth-title">Welcome back!</h1>
        <p id="auth-subtitle">We're so excited to see you again!</p>
        <label id="display-name-label" hidden
          >DISPLAY NAME<input
            id="register-name"
            maxlength="32"
            autocomplete="nickname" /></label
        ><label
          >USERNAME <em>*</em
          ><input
            id="auth-username"
            required
            minlength="3"
            maxlength="24"
            autocomplete="username"
            pattern="[a-zA-Z0-9_.]+" /></label
        ><label
          >PASSWORD <em>*</em
          ><input
            id="auth-password"
            required
            minlength="8"
            maxlength="128"
            type="password"
            autocomplete="current-password"
        /></label>
        <div id="auth-error" class="form-error" role="alert"></div>
        <button class="primary full" id="auth-submit">Log In</button>
        <p class="auth-switch">
          <span id="auth-switch-label">Need an account?</span>
          <button type="button" id="auth-switch">Register</button>
        </p>
        <button
          type="button"
          id="auth-connection"
          class="text-button auth-connection"
        >
          Server connection
        </button>
      </form>
    </section>
    <div id="shell" hidden>
      <nav id="server-rail" aria-label="Servers"></nav>
      <aside id="channel-sidebar">
        <div id="sidebar-top"></div>
        <nav id="channel-list" aria-label="Channels and direct messages"></nav>
        <div id="voice-connected" hidden></div>
        <div id="user-controls"></div>
      </aside>
      <main id="workspace">
        <header id="topbar"></header>
        <div id="content">
          <section id="chat-column">
            <div id="call-view" hidden></div>
            <div id="new-messages-bar" hidden></div>
            <div id="chat-scroll" tabindex="0">
              <div id="channel-welcome"></div>
              <div
                id="message-list"
                role="log"
                aria-label="Messages"
                aria-live="polite"
              ></div>
            </div>
            <div id="composer-wrap">
              <div id="command-picker" class="command-picker" hidden></div>
              <div id="reply-banner" hidden></div>
              <div id="attachment-drafts" hidden></div>
              <form id="composer">
                <button
                  type="button"
                  id="composer-plus"
                  class="icon-button"
                  title="Upload a file"
                  aria-label="Upload a file"
                ></button
                ><textarea
                  id="message-input"
                  rows="1"
                  maxlength="2000"
                  placeholder="Message #general"
                  aria-label="Message"
                ></textarea>
                <div class="composer-tools">
                  <button
                    type="button"
                    id="composer-poll"
                    class="icon-button"
                    title="Create Poll"
                    aria-label="Create Poll"
                  ></button>
                  <button
                    type="button"
                    id="composer-emoji"
                    class="icon-button"
                    title="Emoji"
                    aria-label="Emoji"
                  ></button
                  ><button
                    type="submit"
                    id="send-message"
                    class="icon-button"
                    title="Send message"
                    aria-label="Send message"
                  ></button>
                </div>
              </form>
              <div id="slowmode-status" role="status" hidden></div>
              <div id="typing-indicator"></div>
            </div>
          </section>
          <section id="friends-view" hidden></section>
          <aside id="detail-panel"></aside>
        </div>
      </main>
    </div>
    <input id="file-input" type="file" multiple hidden />
    <dialog id="modal">
      <button
        id="modal-close"
        class="icon-button modal-close"
        aria-label="Close"
      ></button>
      <div id="modal-content"></div>
    </dialog>
    <div id="context-menu" class="context-menu" role="menu" hidden></div>
    <div id="emoji-picker" class="emoji-picker" hidden></div>
    <div id="toast-stack" aria-live="polite"></div>
    <div id="remote-media" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
