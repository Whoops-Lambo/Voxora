# Review Render's current instance and disk price before selecting Deploy.
# A free web service does not provide the persistent disk required by Voxora.
services:
  - type: web
    name: voxora-public
    runtime: docker
    repo: https://github.com/Whoops-Lambo/Voxora
    branch: main
    plan: starter
    numInstances: 1
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node public-server.js
    healthCheckPath: /api/info
    disk:
      name: voxora-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: VOXORA_HOST
        value: 0.0.0.0
      - key: VOXORA_DATA_DIR
        value: /data
      - key: VOXORA_OWNER_USERNAME
        value: voxora_owner
      - key: VOXORA_OWNER_DISPLAY_NAME
        value: Voxora Owner
      - key: VOXORA_OWNER_PASSWORD
        generateValue: true
